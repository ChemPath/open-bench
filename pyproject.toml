[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chempath-demo"
version = "0.2.0"
description = "Open Bench: public demonstration of ChemPath molecular characterization, with SHAP explainability on a synthetic model."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Cloak & Quill Research" }]
dependencies = [
  "rdkit>=2023.9.1",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "shap>=0.44",
]

[project.optional-dependencies]
pdf = ["reportlab>=4.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "reportlab>=4.0"]

[project.scripts]
chempath-demo = "chempath_demo.cli:main"

[tool.setuptools]
packages = ["chempath_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
